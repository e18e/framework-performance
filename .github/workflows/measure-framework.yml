name: Framework benchmarks

env:
  CHROME_PATH: /usr/bin/google-chrome

on:
  workflow_call:
    inputs:
      install:
        description: 'JSON array of frameworks to measure install time'
        type: string
        required: true
      build:
        description: 'JSON array of frameworks to measure build time'
        type: string
        required: true
      devServer:
        description: 'JSON array of frameworks to measure dev server startup time'
        type: string
        required: false
        default: '[]'
      ssrThroughput:
        description: 'JSON array of frameworks to measure SSR request throughput performance'
        type: string
        required: true
      ssrLoad:
        description: 'JSON array of frameworks to measure SSR load performance'
        type: string
        required: false
        default: '[]'
      ssrLoadRouterLinks:
        description: 'JSON array of frameworks to measure SSR router link load performance'
        type: string
        required: false
        default: '[]'
      dependencies:
        description: 'JSON array of frameworks to run e18e dependency analysis'
        type: string
        required: false
        default: '[]'
      csrLighthouse:
        description: 'JSON array of frameworks to measure client-side rendered paint and interaction performance'
        type: string
        required: false
        default: '[]'
      ssrLighthouse:
        description: 'JSON array of frameworks to measure server-side rendered paint and interaction performance'
        type: string
        required: false
        default: '[]'
      ssrInitialLoad:
        description: 'JSON array of frameworks to measure initial page resource downloads'
        type: string
        required: false
        default: '[]'
      ssrInitialLoadImages:
        description: 'JSON array of frameworks to measure initial page resource downloads for images'
        type: string
        required: false
        default: '[]'
      ssrInitialLoadFrameworkImages:
        description: 'JSON array of frameworks to measure initial page resource downloads for framework images'
        type: string
        required: false
        default: '[]'

jobs:
  install:
    name: ${{ matrix.framework.displayName }} · Install
    if: inputs.install != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.install) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install stats-generator dependencies
        run: pnpm install --frozen-lockfile --filter @framework-performance/stats-generator...

      - name: Run install benchmark
        run: |
          pnpm --filter @framework-performance/stats-generator run:install ${{ matrix.framework.name }}

      - name: Upload install stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/install-stats.json
          retention-days: 1
          if-no-files-found: error

  build:
    name: ${{ matrix.framework.displayName }} · Build
    if: inputs.build != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.build) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build benchmark
        run: |
          pnpm --filter @framework-performance/stats-generator run:build ${{ matrix.framework.name }}

      - name: Scan build output for vendored core-js
        if: contains(matrix.framework.measurements, 'coreJS')
        run: pnpm --filter @framework-performance/stats-generator run:corejs ${{ matrix.framework.name }}

      - name: Scan build output for browser baseline requirements
        if: contains(matrix.framework.measurements, 'browserBaseline')
        run: pnpm --filter @framework-performance/stats-generator run:browser-baseline ${{ matrix.framework.name }}

      - name: Upload build stats
        if: contains(matrix.framework.measurements, 'buildDuration')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/build-stats.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload core-js stats
        if: contains(matrix.framework.measurements, 'coreJS')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corejs-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/corejs-stats.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload browser baseline stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: contains(matrix.framework.measurements, 'browserBaseline')
        with:
          name: browser-baseline-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/browser-baseline-stats.json
          retention-days: 1
          if-no-files-found: error

  devServer:
    name: ${{ matrix.framework.displayName }} · Dev server
    if: inputs.devServer != '[]'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.devServer) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dev server benchmark
        run: |
          pnpm --filter @framework-performance/stats-generator run:dev-server ${{ matrix.framework.name }}

      - name: Upload dev server stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-server-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/dev-server-stats.json
          retention-days: 1
          if-no-files-found: error

  ssrThroughput:
    name: ${{ matrix.framework.displayName }} · SSR throughput
    if: inputs.ssrThroughput != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.ssrThroughput) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build

      - name: Run SSR request throughput benchmark
        run: pnpm --filter @framework-performance/stats-generator run:ssr-request-throughput ${{ matrix.framework.name }}

      - name: Upload SSR request throughput stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssrThroughput-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/ssrThroughput-stats.json
          retention-days: 1
          if-no-files-found: error

  dependencies:
    name: ${{ matrix.framework.displayName }} · Dependencies
    if: inputs.dependencies != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.dependencies) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install stats-generator dependencies
        run: pnpm install --frozen-lockfile --filter @framework-performance/stats-generator...

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Run e18e analysis
        if: contains(matrix.framework.measurements, 'dependencyCounts')
        working-directory: ./packages/${{ matrix.framework.package }}
        run: |
          (npx @e18e/cli@0.5.0 analyze --json || true) |
            node ../stats-generator/src/scripts/format-e18e-stats.ts e18e-stats.json

      - name: Collect framework dependency stats
        if: contains(matrix.framework.measurements, 'dependencyCounts')
        env:
          FRAMEWORK_NAME: ${{ matrix.framework.name }}
        run: node packages/stats-generator/src/run-benchmarks-scripts/run-framework-dependency-scan.ts "$FRAMEWORK_NAME"

      - name: Collect first-party dependency stats
        if: contains(matrix.framework.measurements, 'dependencyCounts')
        env:
          FRAMEWORK_NAME: ${{ matrix.framework.name }}
        run: node packages/stats-generator/src/run-benchmarks-scripts/run-first-party-dependency-scan.ts "$FRAMEWORK_NAME"

      - name: Scan installed dependencies for Node engine constraints
        if: contains(matrix.framework.measurements, 'minimumNodeVersion')
        run: pnpm --filter @framework-performance/stats-generator run:node-engines ${{ matrix.framework.name }}

      - name: Upload dependency stats
        if: contains(matrix.framework.measurements, 'dependencyCounts')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e18e-stats-${{ matrix.framework.name }}
          path: |
            packages/${{ matrix.framework.package }}/e18e-stats.json
            packages/${{ matrix.framework.package }}/framework-dependency-stats.json
            packages/${{ matrix.framework.package }}/first-party-dependency-stats.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload node engines stats
        if: contains(matrix.framework.measurements, 'minimumNodeVersion')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-engines-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/node-engines-stats.json
          retention-days: 1
          if-no-files-found: error

  ssrLoad:
    name: ${{ matrix.framework.displayName }} · SSR load
    if: inputs.ssrLoad != '[]'
    runs-on: depot-ubuntu-24.04-16
    env:
      RUNNER_OVERRIDE: 'Depot depot-ubuntu-24.04-16 GitHub Actions runner (16 CPUs, 64 GB RAM, 180 GB disk, 8 GB disk accelerator; server CPUs 0-11; Autocannon CPUs 12-15)'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.ssrLoad) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build

      - name: Run SSR load benchmark
        run: pnpm --filter @framework-performance/stats-generator run:ssr-load:containerized ${{ matrix.framework.name }}

      - name: Upload SSR load stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssrLoad-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/ssrLoad-stats.json
          retention-days: 1
          if-no-files-found: error

  ssrLoadRouterLinks:
    name: ${{ matrix.framework.displayName }} · SSR load (router links)
    if: inputs.ssrLoadRouterLinks != '[]'
    runs-on: depot-ubuntu-24.04-16
    env:
      RUNNER_OVERRIDE: 'Depot depot-ubuntu-24.04-16 GitHub Actions runner (16 CPUs, 64 GB RAM, 180 GB disk, 8 GB disk accelerator; server CPUs 0-11; Autocannon CPUs 12-15)'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.ssrLoadRouterLinks) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build

      - name: Run SSR router link load benchmark
        run: pnpm --filter @framework-performance/stats-generator run:ssr-router-link-load:containerized ${{ matrix.framework.name }}

      - name: Upload SSR router link load stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssrLoadRouterLinks-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/ssrLoadRouterLinks-stats.json
          retention-days: 1
          if-no-files-found: error

  csrLighthouse:
    name: ${{ matrix.framework.displayName }} · CSR Lighthouse
    if: inputs.csrLighthouse != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.csrLighthouse) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build

      - name: Run client-side rendered benchmark
        run: pnpm --filter @framework-performance/stats-generator run:client-side-rendered ${{ matrix.framework.name }}

      - name: Upload client-side rendered stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csrLighthouse-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/csrLighthouse-stats.json
          retention-days: 1
          if-no-files-found: error

  ssrLighthouse:
    name: ${{ matrix.framework.displayName }} · SSR Lighthouse
    if: inputs.ssrLighthouse != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.ssrLighthouse) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build

      - name: Run server-side rendered benchmark
        run: pnpm --filter @framework-performance/stats-generator run:server-side-rendered ${{ matrix.framework.name }}

      - name: Upload server-side rendered stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssrLighthouse-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/ssrLighthouse-stats.json
          retention-days: 1
          if-no-files-found: error

  ssrInitialLoad:
    name: ${{ matrix.framework.displayName }} · SSR initial load
    if: inputs.ssrInitialLoad != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.ssrInitialLoad) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        env:
          COMPRESS_PUBLIC_ASSETS: 'true'
        run: pnpm build

      - name: Run initial load benchmark
        run: pnpm --filter @framework-performance/stats-generator run:ssr-initial-load ${{ matrix.framework.name }}

      - name: Upload initial load stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssrInitialLoad-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/ssrInitialLoad-stats.json
          retention-days: 1
          if-no-files-found: error

  ssrInitialLoadImages:
    name: ${{ matrix.framework.displayName }} · SSR initial load images
    if: inputs.ssrInitialLoadImages != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.ssrInitialLoadImages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        env:
          COMPRESS_PUBLIC_ASSETS: 'true'
        run: pnpm build

      - name: Run initial load images benchmark
        run: pnpm --filter @framework-performance/stats-generator run:ssr-initial-load-images ${{ matrix.framework.name }}

      - name: Upload initial load images stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssrInitialLoadImages-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/ssrInitialLoadImages-stats.json
          retention-days: 1
          if-no-files-found: error

  ssrInitialLoadFrameworkImages:
    name: ${{ matrix.framework.displayName }} · SSR initial load framework images
    if: inputs.ssrInitialLoadFrameworkImages != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.ssrInitialLoadFrameworkImages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        env:
          COMPRESS_PUBLIC_ASSETS: 'true'
        run: pnpm build

      - name: Run initial load framework images benchmark
        run: pnpm --filter @framework-performance/stats-generator run:ssr-initial-load-framework-images ${{ matrix.framework.name }}

      - name: Upload initial load framework images stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssrInitialLoadFrameworkImages-stats-${{ matrix.framework.name }}
          path: packages/${{ matrix.framework.package }}/ssrInitialLoadFrameworkImages-stats.json
          retention-days: 1
          if-no-files-found: error
